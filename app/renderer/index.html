<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" />
  <title>Design Review</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="l0-map.css" />
</head>
<body>
  <!-- 首屏：Import / Start（视觉与交互规则见 docs/harness/DESIGN.md） -->
  <section id="screen-start" class="screen">
    <div class="start-card">
      <h1>Design Review</h1>
      <p class="muted">打开一份分析资料包，先看框架图，再查看解释和出处。</p>
      <div class="start-block">
        <button id="btn-open-bundle" class="btn primary">打开分析资料包</button>
        <p class="file-hint">选择资料夹中的 reading-bundle.json，一并加载相关材料。</p>
      </div>
      <div id="start-error" class="error-box hidden"></div>
      <details id="legacy-entry" class="start-details">
        <summary>开发与旧版入口</summary>
        <p class="muted">用于测试样本和单独文件的兼容检查。</p>
        <div class="start-block">
          <div class="start-label">测试原文</div>
          <div class="start-row">
            <button id="btn-pick-markdown" class="btn ghost">选择 Markdown 文件</button>
            <button id="btn-use-default-markdown" class="btn ghost">使用测试样本</button>
          </div>
          <div id="md-info" class="file-hint">尚未选择 Markdown。</div>
        </div>
        <div class="start-block">
          <div class="start-label">单独审阅文件</div>
          <div class="start-row">
            <button id="btn-load-fixture" class="btn ghost">打开标准测试样本</button>
            <button id="btn-open-json" class="btn ghost">打开 design-review.json</button>
          </div>
          <div id="fixture-info" class="file-hint"></div>
        </div>
        <div class="start-block">
          <div class="start-label">单独框架图</div>
          <button id="btn-open-l0" class="btn ghost">打开 framework-map.json</button>
          <div id="l0-info" class="file-hint">尚未加载框架图。</div>
        </div>
      </details>
    </div>
  </section>

  <!-- Review 页面 -->
  <section id="screen-review" class="screen hidden">
    <header class="topbar">
      <div class="topbar-left">
        <div class="doc-title" id="design-title">—</div>
        <div class="doc-meta">
          <span id="design-id" class="pill"></span>
          <span id="design-status" class="pill"></span>
          <span id="model-path" class="mono muted small"></span>
        </div>
      </div>
      <div class="topbar-right">
        <nav class="view-switch">
          <button class="nav-item active" data-view="overview">方案总览</button>
          <button class="nav-item" data-view="decisions">决策清单 <span id="nav-decision-count" class="nav-count"></span></button>
          <button class="nav-item" data-view="l0">L0 框架图 <span id="nav-l0-state" class="nav-count"></span></button>
        </nav>
        <div id="gate-badge" class="gate-badge pending">—</div>
        <button id="btn-save" class="btn primary">保存 human-review.json</button>
        <button id="btn-reload" class="btn ghost">重新加载</button>
        <button id="btn-back" class="btn ghost">返回</button>
      </div>
    </header>

    <div class="layout">
      <aside class="toc-pane">
        <nav id="toc" class="toc"></nav>
        <div class="toc-foot">
          <div id="stage-indicator" class="stage-indicator">当前阅读：—</div>
          <div id="save-state" class="muted small">未保存</div>
          <button id="btn-reveal" class="link-btn">打开 human-review.json 位置</button>
        </div>
      </aside>

      <main id="main" class="main"></main>

      <aside id="source-panel" class="source-pane hidden">
        <div class="source-head">
          <div id="source-head" class="source-head-inner"></div>
          <button id="source-close" class="btn tiny ghost">关闭</button>
        </div>
        <div id="source-body" class="source-body"></div>
      </aside>
    </div>
  </section>

  <script src="vendor/mermaid.min.js"></script>
  <script src="../shared/semantics.js"></script>
  <script src="l0-layout.js"></script>
<script src="l0-map.js"></script>
  <script src="l3-inspector.js"></script>
  <script src="app.js"></script>
</body>
</html>
